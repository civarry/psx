name: Keep Streamlit Alive

# Two independent activity signals so Streamlit Cloud doesn't hibernate:
#  1. HTTP GET the live app URL  -> real visitor traffic.
#  2. Bump utils/_build_info.py  -> a real Python file in the source tree
#     gets a new timestamp + build hash every run. Looks like a normal CI
#     version-bump commit. The file is intentionally not imported anywhere,
#     so a bad write can never break the app at runtime.
on:
  schedule:
    - cron: '17 1 * * *'   #  9:17 AM PHT
    - cron: '23 9 * * *'   #  5:23 PM PHT
    - cron: '41 17 * * *'  #  1:41 AM PHT
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ping live app URL
        env:
          APP_URL: https://mpxpsl.streamlit.app/
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -L \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --max-time 60 \
            -A "Mozilla/5.0 (compatible; GH-Actions-KeepAlive/1.0)" \
            -o /dev/null -w "%{http_code}" \
            "$APP_URL")
          echo "App responded with HTTP $STATUS"
          case "$STATUS" in
            2??|3??) ;;
            *) echo "Unexpected status"; exit 1 ;;
          esac

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump build info and push
        run: |
          set -euo pipefail

          NOW_UTC=$(date -u "+%Y-%m-%dT%H:%M:%SZ")
          NOW_PHT=$(TZ="Asia/Manila" date "+%Y-%m-%d %H:%M:%S PHT")
          BUILD_ID=$(TZ="Asia/Manila" date "+%Y%m%d.%H%M%S")
          BUILD_HASH=$(printf '%s' "$NOW_UTC-$GITHUB_RUN_ID" | sha1sum | cut -c1-12)

          # Rewrite utils/_build_info.py. This file is internal (underscore
          # prefix) and intentionally NOT imported anywhere in the app, so a
          # malformed write cannot break runtime. Streamlit/GitHub still see
          # it as a real .py source-file change.
          cat > utils/_build_info.py <<PY
          """Build metadata. Auto-generated by .github/workflows/keep-alive.yml.

          Not imported by the application. Safe to regenerate on every CI run.
          """

          BUILD_ID = "${BUILD_ID}"
          BUILD_HASH = "${BUILD_HASH}"
          BUILT_AT_UTC = "${NOW_UTC}"
          BUILT_AT_PHT = "${NOW_PHT}"
          PY

          # Sanity check: file must be valid Python. If syntax somehow broke,
          # abort before pushing rather than poison the repo.
          python3 -c "import ast, sys; ast.parse(open('utils/_build_info.py').read())"

          git add utils/_build_info.py
          git commit -m "chore: bump build ${BUILD_ID} (${BUILD_HASH}) [skip ci]"
          git pull --rebase origin main
          git push
