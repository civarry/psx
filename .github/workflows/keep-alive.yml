name: Keep Streamlit Alive

# Run outside work hours (8am-5pm PHT) to prevent Streamlit hibernation
on:
  schedule:
    # 7:00 AM PHT (23:00 UTC) - before work
    # 6:00 PM PHT (10:00 UTC) - after work
    # 2:00 AM PHT (18:00 UTC) - night backup
    - cron: '0 10,18,23 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update heartbeat file and push
        run: |
          NOW=$(TZ="Asia/Manila" date "+%Y-%m-%d %H:%M:%S PHT")
          echo "$NOW" > heartbeat.txt
          git add heartbeat.txt
          git commit -m "chore: keep-alive heartbeat ${NOW} [skip ci]"
          git push
