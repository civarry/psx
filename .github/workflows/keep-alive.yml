name: Keep Streamlit Alive

# Two independent activity signals so Streamlit Cloud doesn't hibernate:
#  1. HTTP GET the live app URL  -> real visitor traffic.
#  2. Bump utils/_build_info.py  -> a real Python file in the source tree
#     gets a new timestamp + build hash every run. The file is intentionally
#     not imported anywhere, so a bad write can never break the app.
on:
  schedule:
    - cron: '17 1 * * *'   #  9:17 AM PHT
    - cron: '23 9 * * *'   #  5:23 PM PHT
    - cron: '41 17 * * *'  #  1:41 AM PHT
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ping live app URL
        env:
          APP_URL: https://mpxpsl.streamlit.app/
        # NOTE: this step is informational. By the time curl returns, the
        # TCP request has already reached Streamlit's edge, which is the only
        # thing that matters for the "real visitor" signal. We log the result
        # but never fail the workflow on a non-2xx / redirect-loop / timeout
        # -- the bump step below is the durable signal.
        continue-on-error: true
        run: |
          # Persist cookies across the redirect chain so Streamlit's session
          # handshake can terminate (without this, curl loops on hibernated
          # apps because each hop resets the cookie state curl is tracking).
          COOKIE_JAR=$(mktemp)
          STATUS=$(curl -sS -L \
            --max-redirs 10 \
            --retry 2 --retry-delay 5 \
            --max-time 45 \
            -b "$COOKIE_JAR" -c "$COOKIE_JAR" \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml" \
            -o /dev/null -w "%{http_code}" \
            "$APP_URL" || echo "curl-error")
          echo "App ping result: $STATUS"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump build info and push
        run: |
          set -euo pipefail

          NOW_UTC=$(date -u "+%Y-%m-%dT%H:%M:%SZ")
          NOW_PHT=$(TZ="Asia/Manila" date "+%Y-%m-%d %H:%M:%S PHT")
          BUILD_ID=$(TZ="Asia/Manila" date "+%Y%m%d.%H%M%S")
          BUILD_HASH=$(printf '%s' "$NOW_UTC-$GITHUB_RUN_ID" | sha1sum | cut -c1-12)

          cat > utils/_build_info.py <<PY
          """Build metadata. Auto-generated by .github/workflows/keep-alive.yml.

          Not imported by the application. Safe to regenerate on every CI run.
          """

          BUILD_ID = "${BUILD_ID}"
          BUILD_HASH = "${BUILD_HASH}"
          BUILT_AT_UTC = "${NOW_UTC}"
          BUILT_AT_PHT = "${NOW_PHT}"
          PY

          python3 -c "import ast; ast.parse(open('utils/_build_info.py').read())"

          git add utils/_build_info.py
          git commit -m "chore: bump build ${BUILD_ID} (${BUILD_HASH}) [skip ci]"
          git pull --rebase origin main
          git push
